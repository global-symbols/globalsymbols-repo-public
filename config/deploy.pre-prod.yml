# =============================================================================
# Kamal destination: pre-prod
# Usage:  kamal deploy -d pre-prod
# Host:   t4g.small  private 172.31.30.149  public 18.130.29.168
# SSH:    global-symbols-ec2-test-t4
#
# DO NOT run kamal setup/deploy until registry + secrets are filled and
# you intentionally want to touch the server.
# =============================================================================

servers:
  web:
    hosts:
      - 18.130.29.168
  job:
    hosts:
      - 18.130.29.168
    cmd: bundle exec sidekiq -C config/sidekiq.yml

# Host nginx owns public 80/443 (Board Builder static + reverse-proxy to Rails).
# kamal-proxy stays in the deploy path on localhost only — see .kamal/proxy/options
#   127.0.0.1:8080→80, 127.0.0.1:8443→443 — so Kamal zero-downtime cutover is unchanged.
# Until app.gs-test.co.uk DNS cutover, smoke via http://18.130.29.168/ with Host header.
#
# Healthcheck: this app has no /up route; default Kamal path /up fails and aborts deploy
# even though Puma is listening. Use /. deploy_timeout is top-level (not under proxy).
proxy:
  host: gs-test.co.uk
  app_port: 3000
  ssl: false
  # ssl: true   # enable after DNS cutover if kamal-proxy terminates TLS
  healthcheck:
    path: /
    interval: 2
    timeout: 5

# Seconds for kamal-proxy to wait for the app to become healthy (default 30)
deploy_timeout: 90

env:
  clear:
    RAILS_ENV: pre-prod
    # Accessory DNS name on Kamal network: {service}-{accessory}
    DATABASE_HOST: gs-repo-db
    DATABASE_PORT: "3306"
    GS_DATABASE_NAME: gs-production
    GS_DATABASE_USERNAME: gs-production
    REDIS_IP: "172.31.13.8"
    REDIS_DB: "0"
    REDIS_CACHE_DB: "2"
    ASSET_HOST: https://gs-test.co.uk
    DIRECTUS_URL: https://cms.gs-test.co.uk
  secret:
    - SECRET_KEY_BASE
    - GS_DATABASE_PASSWORD
    - REDIS_PASSWORD
    - DIRECTUS_TOKEN_CMS
    - DIRECTUS_WEBHOOK_SECRET
    # Post-deploy suite (menu → verify): Devise bot user for optional auth/CRUD
    - DEPLOY_VERIFY_USER_EMAIL
    - DEPLOY_VERIFY_USER_PASSWORD

# MySQL 8 on the same box (pre-prod only — prod uses host MySQL on m7g)
accessories:
  db:
    image: mysql:8.0
    host: 18.130.29.168
    # Publish to host loopback so bare Go (and mysql client) can use 127.0.0.1:3306
    port: "127.0.0.1:3306:3306"
    env:
      clear:
        MYSQL_DATABASE: gs-production
        MYSQL_USER: gs-production
      secret:
        - MYSQL_ROOT_PASSWORD
        - MYSQL_PASSWORD
    directories:
      - mysql_data:/var/lib/mysql
    # Match local Docker MySQL 8 flags used during Rails 8 upgrade
    cmd: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
