# =============================================================================
# Kamal destination: production (skeleton — fill when m7g is launched)
# Usage:  kamal deploy -d production
#
# Differences from pre-prod:
#   - Rails + Sidekiq on m7g.medium (not t4g)
#   - MySQL primary is HOST install on m7g (no accessory here)
#   - Go + MySQL replica stay on t3.medium (172.31.41.204) — not Kamal
#   - Redis DB indexes 1 / 3
# =============================================================================

servers:
  web:
    hosts:
      - REPLACE_WITH_M7G_PUBLIC_OR_PRIVATE_IP
  job:
    hosts:
      - REPLACE_WITH_M7G_PUBLIC_OR_PRIVATE_IP
    cmd: bundle exec sidekiq -C config/sidekiq.yml

proxy:
  host: globalsymbols.com
  app_port: 3000
  ssl: false
  # ssl: true after DNS / edge plan is fixed
  healthcheck:
    path: /
    interval: 2
    timeout: 5

deploy_timeout: 90

env:
  clear:
    RAILS_ENV: production
    # Host MySQL on same machine as Rails containers
    DATABASE_HOST: host.docker.internal
    # If host.docker.internal is unreliable on Linux, use m7g private IP instead
    DATABASE_PORT: "3306"
    GS_DATABASE_NAME: gs-production
    GS_DATABASE_USERNAME: gs-production
    REDIS_IP: "172.31.13.8"
    REDIS_DB: "1"
    REDIS_CACHE_DB: "3"
    ASSET_HOST: https://globalsymbols.com
  secret:
    - SECRET_KEY_BASE
    - GS_DATABASE_PASSWORD
    - REDIS_PASSWORD
    - DIRECTUS_TOKEN_CMS
    - DIRECTUS_WEBHOOK_SECRET
    - AWS_ACCESS_KEY_ID
    - AWS_SECRET_ACCESS_KEY

# No MySQL accessory — primary is host mysqld; replica is on Go box (t3).
# accessories: {}
