# =============================================================================
# Kamal base config — shared by pre-prod and production destinations.
#
# Deploy (when ready — does NOT run automatically):
#   kamal setup  -d pre-prod    # first time only (Docker already on host)
#   kamal deploy -d pre-prod
#   kamal deploy -d production  # later
#
# This file alone is not enough: use a destination (-d pre-prod | production).
# Secrets: .kamal/secrets-common + .kamal/secrets[-destination] (never commit).
# =============================================================================

# Used as Docker network / container name prefix (hostname for accessories: gs-repo-db)
service: gs-repo

# GHCR: registry.server + image path (do not put ghcr.io/ in image — Kamal prefixes it).
# Full name becomes: ghcr.io/global-symbols/globalsymbols-repo-internal:<git-sha>
# Requires: package write access + PAT with write:packages (and read:packages)
image: global-symbols/globalsymbols-repo-internal

registry:
  server: ghcr.io
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

# SSH from laptop to EC2 (public IP or use ssh config Host)
ssh:
  user: ubuntu
  keys:
    - ~/.ssh/global-symbols.pem

# Build on Apple Silicon / Graviton (t4g, m7g) — arm64.
# driver: docker uses the host Docker engine (desktop-linux) instead of a
# separate buildx "docker-container" BuildKit VM. That path hangs less often
# on Mac and still supports linux/arm64 natively on Apple Silicon.
builder:
  arch: arm64
  driver: docker
  dockerfile: Dockerfile
  context: .

# Uploads + Active Storage (symbolset zip_bundles) survive deploys
volumes:
  - "gs_repo_uploads:/rails/public/uploads"
  - "gs_repo_storage:/rails/storage"

# Logging
logging:
  driver: json-file
  options:
    max-size: "100m"
    max-file: "5"

# Base env — destinations override RAILS_ENV, Redis DBs, hosts, ASSET_HOST
env:
  clear:
    RAILS_LOG_TO_STDOUT: "1"
    RAILS_SERVE_STATIC_FILES: "true"
    # Keep concurrency low until host RAM is proven (t4g.small)
    RAILS_MAX_THREADS: "5"
    WEB_CONCURRENCY: "0"
  secret:
    - SECRET_KEY_BASE
    - GS_DATABASE_PASSWORD
    - REDIS_PASSWORD
    - DIRECTUS_TOKEN_CMS
    - DIRECTUS_WEBHOOK_SECRET

# Default deploy health wait (destinations may override)
deploy_timeout: 90

# Aliases for convenience (optional)
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"
